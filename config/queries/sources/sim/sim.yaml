# Wires the existing SIM FHIR conversion SQL (queries/sim/fhir/*.sql, already
# used by the CLI batch pipeline against test/data/sim/) into the live query
# compiler, so the FHIR API server (and Group member-filter resolution) can
# serve Patient/Observation searches for the "sim" source too.
#
# Patient supports ?_id=, scoping to one patient's row in
# test/data/sim/Patient.csv (see queries/sim/fhir/patient.sql). Observation
# supports ?status= (the real Status column in
# test/data/sim/AlgemeneMeting.csv) and ?patient= (scoping to one patient's
# rows, same file).
#
# Per query, two contexts:
#   pushdown  FHIR params applied in SQL when the query runs as a STANDALONE
#             search (GET /r4/<Type>?...).
#   member_filter  how the same query behaves as a Group member-filter / $export
#             (internal/querycompiler/group.go). All members optional:
#       patient   SQL expression over the query's FIRST (root) statement
#                 giving the patient number. Default: CAST(id AS TEXT) for
#                 Patient, SUBSTR("subject.reference", 9) for other types.
#       pushdown  params applied in SQL when used as a Group member-filter.
#                 Default: the standalone pushdown list. A member-filter with
#                 a param outside it still works: that filter falls back to
#                 the normal search + in-Go filtering, and its patient numbers
#                 are joined into the Group members query.
#             A resource with several queries is only pushed down for a param
#             when EVERY one of its queries lists it.

source: sim

resources:
  Patient:
    queries:
      - name: main
        sql: queries/sim/fhir/patient.sql
        pushdown: [_id, birthdate]
        member_filter:
          patient: CAST(id AS TEXT)
          pushdown: [birthdate]

  Observation:
    queries:
      - name: main
        sql: queries/sim/fhir/observation.sql
        pushdown: [status, patient, code]
        member_filter:
          patient: SUBSTR("subject.reference", 9)
          pushdown: [status, code]
